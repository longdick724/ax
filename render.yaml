services:
  - type: web
    name: jarvis-sniper
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: HELIUS_KEY
        sync: false
      - key: SOLANA_PRIVATE_KEY
        sync: false
      - key: FREELLM_API_KEY
        sync: false
      - key: BIRDEYE_API_KEY
        sync: false
